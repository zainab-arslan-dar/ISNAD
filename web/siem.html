<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISNAD SIEM – Live Operations View</title>
<style>
:root{--bg:#08110e;--pn:#0f1b16;--ln:#20352b;--tx:#e3ebe6;--mu:#86a094;--ac:#c9a24a;--g:#c9a24a;--s1:#2fa36b;--s2:#d9a21b;--s3:#e8742a;--s4:#e5484d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 "Segoe UI",Roboto,Arial,sans-serif;background-image:linear-gradient(var(--ln) 1px,transparent 1px),linear-gradient(90deg,var(--ln) 1px,transparent 1px);background-size:48px 48px;background-position:-1px -1px}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0,#0d2a1fcc,var(--bg) 75%);z-index:-1}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:12px 22px;background:#0a1511f0;border-bottom:1px solid var(--ln);border-top:3px solid var(--g)}
h1{margin:0;font:600 18px Consolas,monospace;letter-spacing:4px}h1 span{color:var(--g)}h1 small{font:11px Consolas,monospace;letter-spacing:1px;color:var(--mu);margin-left:12px}
a.bk{color:var(--ac);text-decoration:none;font:12px Consolas,monospace;border:1px solid var(--ac);padding:4px 10px;border-radius:2px}
.ls{font:12px Consolas,monospace;color:var(--mu)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--s4);margin-right:6px}.dot.on{background:var(--s1);animation:p 1.6s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 #2fa36b99}100%{box-shadow:0 0 0 9px #2fa36b00}}
main{padding:16px 22px;max-width:1500px;margin:auto;display:grid;gap:14px;grid-template-columns:repeat(12,1fr)}
.c{background:var(--pn);border:1px solid var(--ln);border-radius:3px;padding:13px;min-width:0;position:relative}
.c:before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:var(--ac);opacity:.5}
.c h3{margin:0 0 10px;font:600 11px Consolas,monospace;letter-spacing:2px;color:var(--mu);text-transform:uppercase}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
@media(max-width:1000px){main>*{grid-column:span 12!important}}
.kv{font:600 30px Consolas,monospace}.kl{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:1px}
#thr{font:700 26px Consolas,monospace;letter-spacing:3px}
.hist{display:flex;align-items:flex-end;gap:3px;height:130px}.hist div{flex:1;border-radius:2px 2px 0 0;min-height:2px}
.ax{display:flex;justify-content:space-between;font:10px Consolas,monospace;color:var(--mu);margin-top:3px}
.tw{overflow:auto;max-height:340px}table{border-collapse:collapse;width:100%;font-size:12px}th{position:sticky;top:0;background:var(--pn);text-align:left;font:600 10px Consolas,monospace;letter-spacing:1px;color:var(--mu);padding:6px;border-bottom:1px solid var(--ln)}
td{padding:6px;border-bottom:1px solid #1a2c24;vertical-align:top;word-break:break-word}.m{font:11px Consolas,monospace}
.sv{padding:1px 7px;border-radius:2px;color:#061018;font:700 10px Consolas,monospace}.v0{background:#6c8196}.v1{background:var(--s1)}.v2{background:var(--s2)}.v3{background:var(--s3)}.v4{background:var(--s4)}
.fl button{background:none;border:1px solid var(--ln);color:var(--mu);font:11px Consolas,monospace;padding:3px 9px;margin-right:4px;cursor:pointer;border-radius:2px}.fl button.on{color:var(--tx);border-color:var(--ac)}
.row{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid #1a2c24;font-size:12px}
.lg{font:11px/1.6 Consolas,monospace;max-height:340px;overflow:auto}.lg div{border-bottom:1px solid #1a2c24;padding:3px 0}.lg b{color:var(--g);font-weight:400}
#toast{position:fixed;right:18px;bottom:18px;background:var(--s4);color:#fff;padding:9px 14px;font:600 12px Consolas,monospace;border-radius:2px;opacity:0;transition:.4s}#toast.on{opacity:1}
</style></head><body>
<header><div style="display:flex;align-items:center;gap:12px"><svg width="34" height="34" viewBox="0 0 40 40" fill="none" stroke="#c9a24a" stroke-width="1.7" stroke-linecap="round"><path d="M20 4a16 16 0 0 1 16 16"/><path d="M20 9a11 11 0 0 1 11 11v4"/><path d="M20 14a6 6 0 0 1 6 6v8"/><path d="M20 19v12"/><path d="M4 20a16 16 0 0 0 5 11.5"/><path d="M9 20a11 11 0 0 1 4-8.5"/><path d="M14 22v6"/></svg><h1>ISNAD<span>/</span>SIEM<small>LIVE OPERATIONS VIEW · الأدلة الجنائية الرقمية</small></h1></div>
<div><span class="ls"><i class="dot" id="dot"></i><span id="ls">CONNECTING</span></span> &nbsp; <a class="bk" href="/" target="_blank">◂ ANALYST WORKBENCH</a></div></header>
<main id="m"></main><div id="toast"></div>
<script>
const SVN=['Info','Low','Medium','High','Critical'],SC=['#6c8196','#2fa36b','#d9a21b','#e8742a','#e5484d'];
const MIT=[[/after brute/,'T1078 Valid Accounts'],[/Brute/,'T1110 Brute Force'],[/log cleared/,'T1070 Indicator Removal'],[/command/,'T1059 Command Execution'],[/Account creation/,'T1136 Create Account'],[/Persistence/,'T1543 Persistence'],[/Port-scan/,'T1046 Network Scanning'],[/outbound/,'T1041 Exfiltration'],[/Privilege/,'T1548 Privilege Escalation'],[/mismatch/,'T1036 Masquerading'],[/entropy/,'T1027 Obfuscation']];
let S={ev:[],tl:[],fd:[],ioc:{}},flt=0,last=0,upd=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=t=>t==null?'n/a':new Date(t).toISOString().replace('T',' ').slice(0,19)+'Z',sv=n=>`<span class="sv v${n}">${SVN[n].toUpperCase()}</span>`;
function draw(){
 const f=[...S.fd].sort((a,b)=>b.sev-a.sev),n=[0,0,0,0,0];S.fd.forEach(x=>n[x.sev]++);
 const pm=S.ev.reduce((a,e)=>Math.max(a,e.sc),0),tl=pm>=60?['CRITICAL',SC[4]]:pm>=30?['HIGH',SC[3]]:pm>=9?['ELEVATED',SC[2]]:S.ev.length?['NORMAL',SC[1]]:['NO DATA',SC[0]];
 const h=Array(24).fill(0);S.tl.forEach(t=>{if(t.ts!=null&&t.sev>0)h[new Date(t.ts).getUTCHours()]++});const hm=Math.max(1,...h);
 const iocs=Object.entries(S.ioc).sort((a,b)=>b[1]-a[1]).slice(0,9),tot=Math.max(1,n[1]+n[2]+n[3]+n[4]);let off=0;
 const arcs=[4,3,2,1].map(i=>{const l=n[i]/tot*251.3,s=`<circle r="40" cx="60" cy="60" fill="none" stroke="${SC[i]}" stroke-width="14" stroke-dasharray="${l} 251.3" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=l;return s}).join('');
 const mt={};S.fd.forEach(x=>{const m=MIT.find(r=>r[0].test(x.t));if(m)mt[m[1]]=(mt[m[1]]||0)+1});
 const tlst=[...S.tl].filter(t=>t.sev>0).sort((a,b)=>(b.ts??0)-(a.ts??0)).slice(0,40);
 document.getElementById('m').innerHTML=`
 <div class="c s3"><h3>Threat level</h3><div id="thr" style="color:${tl[1]}">${tl[0]}</div><div class="kl">Highest triage score ${pm}/100</div></div>
 ${[['Evidence items',S.ev.length],['Events parsed',S.tl.length],['Alerts (Med+)',n[2]+n[3]+n[4]],['Critical',n[4]]].map(x=>`<div class="c s2"><div class="kv">${x[1]}</div><div class="kl">${x[0]}</div></div>`).join('')}
 <div class="c s1" style="grid-column:span 1"><div class="kv">${Object.keys(S.ioc).length}</div><div class="kl">IOCs</div></div>
 <div class="c s3"><h3>Severity mix</h3><div style="display:flex;align-items:center;gap:14px"><svg width="120" height="120" viewBox="0 0 120 120"><circle r="40" cx="60" cy="60" fill="none" stroke="#1a2c24" stroke-width="14"/>${arcs}<text x="60" y="66" text-anchor="middle" fill="#cdd9e5" font-family="Consolas" font-size="20">${n[1]+n[2]+n[3]+n[4]}</text></svg><div>${[4,3,2,1].map(i=>`<div class="kl"><span style="color:${SC[i]}">■</span> ${SVN[i]} ${n[i]}</div>`).join('')}</div></div></div>
 <div class="c s5"><h3>Suspicious activity by hour (UTC)</h3><div class="hist">${h.map((v,i)=>`<div title="${i}:00 – ${v} events" style="height:${v/hm*100}%;background:${v/hm>.66?SC[4]:v/hm>.33?SC[3]:'#c9a24a'}"></div>`).join('')}</div><div class="ax"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div></div>
 <div class="c s4"><h3>ATT&amp;CK mapping (indicative)</h3>${Object.entries(mt).map(([k,v])=>`<div class="row"><span>${k}</span><b>${v}</b></div>`).join('')||'<span class="kl">None yet</span>'}</div>
 <div class="c s8"><h3>Alert queue</h3><div class="fl" style="margin-bottom:8px">${[0,2,3,4].map(i=>`<button class="${flt===i?'on':''}" onclick="flt=${i};draw()">${i?SVN[i]+'+':'ALL'}</button>`).join('')}</div>
  <div class="tw"><table><tr><th>ID</th><th>Sev</th><th>Finding</th><th>Source</th><th>Time</th><th>Why it matters</th></tr>${f.filter(x=>x.sev>=flt).map(x=>`<tr><td class="m">${x.id}</td><td>${sv(x.sev)}</td><td><b>${esc(x.t)}</b></td><td>${esc(x.file)}</td><td class="m">${iso(x.ts)}</td><td>${esc(x.w)}</td></tr>`).join('')}</table></div></div>
 <div class="c s4"><h3>Live event stream</h3><div class="lg">${tlst.map(t=>`<div><b>${iso(t.ts).slice(5,19)}</b> ${sv(t.sev)} ${esc(t.type)}<br><span style="color:var(--mu)">${esc(t.detail.slice(0,90))}</span></div>`).join('')||'<span class="kl">Waiting for evidence…</span>'}</div></div>
 <div class="c s6"><h3>Evidence triage queue</h3><div class="tw"><table><tr><th>Pri</th><th>Score</th><th>Item</th><th>Type</th><th>Entropy</th></tr>${[...S.ev].sort((a,b)=>b.sc-a.sc).map(e=>`<tr><td><b>${e.pr}</b></td><td>${e.sc}</td><td>${esc(e.name)}</td><td>${e.kind}</td><td class="m">${e.ent.toFixed(2)}</td></tr>`).join('')}</table></div></div>
 <div class="c s6"><h3>Top indicators</h3>${iocs.map(([k,v])=>`<div class="row"><span class="m">${esc(k.split('|')[0])} · ${esc(k.split('|')[1].slice(0,60))}</span><b>${v}</b></div>`).join('')||'<span class="kl">None yet</span>'}</div>
 <div class="c s12"><h3>Ranked leads (P1–P4)</h3><div class="tw"><table><tr><th>Lead</th><th>Pri</th><th>Entities</th><th>Events</th><th>ATT&amp;CK</th><th>Why flagged</th></tr>${(S.leads||[]).map(l=>`<tr><td class="m">${l.id}</td><td><b>${l.pri}</b></td><td class="m">${esc(l.entities.slice(0,4).join(', '))}</td><td>${l.n}</td><td class="m">${esc(l.techniques.join(', '))}</td><td>${l.reasons.map(esc).join('; ')}</td></tr>`).join('')||'<tr><td colspan="6">No leads yet</td></tr>'}</table></div></div>
 <div class="c s12"><h3>Chain-of-custody ledger (hash-chained)</h3><div id="led" class="lg"></div></div>`;led();
 const nw=S.fd.length;if(nw>last&&last>=0&&upd){const t=document.getElementById('toast');t.textContent='+'+(nw-last)+' NEW FINDING(S) FROM ANALYST';t.classList.add('on');setTimeout(()=>t.classList.remove('on'),3500)}last=nw;upd=new Date();
 document.getElementById('ls').textContent='LIVE · UPDATED '+upd.toISOString().slice(11,19)+'Z'}
async function led(){try{const r=await(await fetch('/api/ledger')).json();document.getElementById('led').innerHTML=`<div>Chain status: <b style="color:${r.valid?'#2fa36b':'#e5484d'}">${r.valid?'VALID':'BROKEN at entry '+r.bad}</b> · ${r.rows.length} entries</div>`+r.rows.slice(-8).reverse().map(x=>`<div><b>${x.ts.slice(5)}</b> ${esc(x.action)} <span style="color:var(--mu)">${esc(x.detail.slice(0,110))}</span> <span style="color:#c9a24a">${x.hash.slice(0,12)}</span></div>`).join('')}catch(e){}}
const live=o=>{document.getElementById('dot').className='dot'+(o?' on':'');if(!o)document.getElementById('ls').textContent='DISCONNECTED – RETRYING'};
fetch('/api/state').then(r=>r.json()).then(s=>{S=s;last=S.fd.length;draw()}).catch(()=>draw());
const es=new EventSource('/events');es.onmessage=e=>{S=JSON.parse(e.data);draw()};es.onopen=()=>live(true);es.onerror=()=>live(false);
draw();
</script></body></html>
